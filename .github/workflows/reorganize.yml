name: Reorganize repository (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Move files into folders
        run: node .github/scripts/reorganize.mjs

      - name: Commit the result and remove this one-time job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/reorganize.yml .github/scripts/reorganize.mjs
          git add -A
          git commit -m "Reorganize repository into folders by purpose" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
