name: Add auto-update headers (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autoupdate.yml'

permissions:
  contents: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add @updateURL / @downloadURL and build INSTALL.md
        run: node .github/scripts/autoupdate.mjs

      - name: Commit the result and remove this one-time job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/autoupdate.yml .github/scripts/autoupdate.mjs
          git add -A
          git commit -m "Add auto-update headers to all userscripts and INSTALL.md link index" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
